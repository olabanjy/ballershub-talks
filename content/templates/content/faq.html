{% extends 'content/base.html' %}
{% load static %}
{% block head_title %}FAQs{% endblock head_title %}
{% block content %}
    <!-- faqs section start  -->
    <section class="faqs-section pt-120 pb-120 texture-bg-2 mt-5">
        <div class="container mt-3">
            <div class="row justify-content-center mb-lg-10 mb-sm-6 mb-4">
                <div class="col-lg-6 text-center" data-aos="fade-down">
                    <span class="subheading-border fw-medium mb-4 fs-xl">
                        <span class="fs-2xl">
                            <i class="ti ti-rocket"></i>
                        </span>
                        FAQs
                    </span>
                    <h4 class="display-four">Frequently Asked Questions</h4>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-12">
                    <!-- tab button  -->
                    <div class="singletab faq-tab d-flex flex-column justify-content-center">
                        <div class="tabcontents" data-aos="zoom-in-up">
                            <!-- faq's items  -->
                            <div class="accordion-section">
                                <div class="row gx-6 gy-4 gy-lg-0 align-items-baseline">
                                    <div class="col-lg-12 d-grid gap-4">
                                        {% for question, answer in faq_data %}
                                            <div class="accordion-item py-4 px-lg-8 px-4 rounded">
                                                <h6 class="accordion-header-area me-6">
                                                    <button class="accordion-btn fs-lg fw-semibold position-relative w-100"
                                                            type="button">
                                                        <span>{{ forloop.counter }}</span> {{ question }}
                                                    </button>
                                                </h6>
                                                <div class="accordion-content">
                                                    <div class="content-body mt-4 pt-3 border-dashed alt-2">
                                                        <p class="fs-sm fw-medium tcn-700">{{ answer }}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        {% endfor %}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- faqs section end -->
{% endblock content %}

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore a world of podcasts on Podcastio. Listen to engaging discussions, interviews, and more.">
    <meta name="author" content="pixelaxis">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="podcast, audio, interviews, discussions, entertainment,ashadul">
    <title> Error | Podcastio</title>
    <link rel="shortcut icon" href="{% static 'assets/img/fabicon.png' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>

<body>

    <!-- ///////// Error Page ///////////// -->

    <section class="error-page inner-hero-section overflow-hidden texture-bg-2">
        <div class="top-wave-shape">
            <img class="w-100" src="{% static 'assets/img/top-wave-shape-2.png' %}" alt="wave shape">
        </div>
        <div class="circle-shape shape-1 alt d-none d-sm-block">
            <img class="w-100" src="{% static 'assets/img/shape-1.png' %}" alt="shape">
        </div>
        <div class="circle-shape shape-2 alt d-none d-sm-block">
            <img class="w-100" src="{% static 'assets/img/shape-2.png' %}" alt="shape">
        </div>
        <div class="circle-shape shape-3 alt d-none d-sm-block">
            <img class="w-100" src="{% static 'assets/img/shape-3.png' %}" alt="shape">
        </div>
        <div class="container pt-120 pb-120">
            <div class="row g-6 justify-content-center">
                <div class="col-lg-8 col-md-10">
                    <div class="error-banner">
                        <img class="w-100" src="{% static 'assets/img/error-banner.png' %}" alt="sign up">
                    </div>
                    <div class="error-text mt-lg-15 mt-sm-10 mt-6 text-center">

                        <h4 class="display-four mb-lg-6 mb-4">Error 404: Oops! Page Not Found</h4>
                        <p class="mb-0">The page you are looking for does not exist. Please check the URL and try again.
                        </p>
                        <a href="/" class="bttn-1 mt-lg-10 mt-6">Go Back Home <span class=" icon d-center icon-right">
                                <i class="ti ti-arrow-narrow-right"></i>
                            </span></a>
                    </div>
                </div>

            </div>
        </div>
        <div class="bottom-wave-shape">
            <img class="w-100" src="{% static 'assets/img/bottom-wave-shape-2.png' %}" alt="wave shape">
        </div>
    </section>

    <!-- jquery  -->
    <script src="{% static 'assets/js/jquery.min.js' %}"></script>
    <!-- swiper js -->
    <script src="{% static 'assets/js/swiper-bundle.min.js' %}"></script>
    <!-- audio player  -->
    <script src="{% static 'assets/js/audio-player.js' %}"></script>
    <!-- magnific-popup  -->
    <script src="{% static 'assets/js/magnific-popup.js' %}_1.1.0.min.js' %}"></script>
    <!-- aos  -->
    <script src="{% static 'assets/js/aos@2.3.1-dist-aos.js' %}"></script>
    <!-- select 2 -->
    <script src="{% static 'assets/js/select2.min.js' %}"></script>
    <!-- main js -->
    <script src="{% static 'assets/js/main.js' %}"></script>
</body>

</html>
